; ═══════════════════════════════════════════════════════════════════════════════
;  IC-JPEG - PlatformIO configuration
;
;  Alvos:
;    cam  - ESP32-CAM (AI-Thinker, OV2640)  - captura + compressão + SPI slave
;    s3   - ESP32-S3                         - SPI master + decode + TFT + SD
;
;  Build:    pio run -e cam        |  pio run -e s3
;  Flash:    pio run -e cam -t upload  (GPIO0→GND antes de ligar, depois reset)
;            pio run -e s3  -t upload  (USB direto)
;  Monitor:  pio device monitor -e cam  |  pio device monitor -e s3
; ═══════════════════════════════════════════════════════════════════════════════

[platformio]
default_envs = cam, s3
boards_dir = boards

; ── ESP32-CAM (AI-Thinker, OV2640) ───────────────────────────────────────────
[env:cam]
platform  = espressif32
board     = esp32cam
framework = espidf

extra_scripts   = pre:scripts/select_src.py
custom_src_dir  = cam/src

; O PlatformIO usa sdkconfig.cam e acrescenta os defaults compartilhados.
board_build.sdkconfig_extras = sdkconfig.defaults

build_flags =
  -DROLE_CAM
  -DBOARD_HAS_PSRAM
  -DEXP_SPI_FREQ_HZ=1000000u
  -DEXP_SPI_MODE=1
  -mfix-esp32-psram-cache-issue
  -DCONFIG_OV2640_SUPPORT=1
  -DCONFIG_SCCB_HARDWARE_I2C_PORT1=1
  -DCONFIG_SCCB_CLK_FREQ=100000
  -DCONFIG_CAMERA_CORE0=1
  -DCONFIG_CAMERA_TASK_STACK_SIZE=2048
  -DCONFIG_CAMERA_DMA_BUFFER_SIZE_MAX=65536
  -Dets_delay_us=esp_rom_delay_us

; Monitor serial local da CAM.
upload_speed   = 460800
monitor_speed  = 115200

; ── ESP32-S3 ──────────────────────────────────────────────────────────────────
[env:s3]
platform  = espressif32
board     = esp32-s3-devkitc-1-psram
framework = espidf

extra_scripts   = pre:scripts/select_src.py
custom_src_dir  = s3/src

; sdkconfig para o S3: base compartilhada + overlay S3 (led_strip, sem câmera)
board_build.sdkconfig_extras =
  sdkconfig.defaults
  sdkconfig.s3_overlay

build_flags =
  -DROLE_S3
  -DBOARD_HAS_PSRAM
  -DEXP_SPI_FREQ_HZ=1000000u
  -DEXP_SPI_MODE=1

upload_speed   = 921600
monitor_speed  = 115200
